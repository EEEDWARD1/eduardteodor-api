services:
  database:
    image: postgres:18.7-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrator:
    build:
      context: .
      dockerfile: EduardTeodor.DbMigrator/Dockerfile
    environment:
      ConnectionStrings__Database: ${ConnectionStrings__Database:?Set ConnectionStrings__Database in .env}
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: EduardTeodor.Presentation/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: ${ConnectionStrings__Database:?Set ConnectionStrings__Database in .env}
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
