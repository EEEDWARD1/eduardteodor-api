services:
  eduardteodor.api:
    image: eduardteodor.api
    build:
      context: .
      dockerfile: EduardTeodor.Api/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    
  # One-off: docker compose -f compose.yaml run --rm migrate
  # Works on a copy of the source so root-owned bin/obj never land in the checkout.
  migrate:
    profiles: ["tools"]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - .:/src:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB};Username=${POSTGRES_USER:?Set POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - cp -r /src /work && cd /work && dotnet tool restore && dotnet restore EduardTeodor.Api/EduardTeodor.Api.csproj && dotnet ef database update --project EduardTeodor.Api
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

